[project]
name = "pune-smartcity-nlp"
version = "0.1.0"
description = "Pune Municipal Corporation Civic Grievance NLP, Knowledge Graph & Anomaly Detection"
readme = "README.md"
requires-python = ">=3.9, <3.13"
dependencies = [
    "streamlit>=1.30.0",
    "spacy>=3.7.0",
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "rdflib>=7.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "networkx>=3.0",
]

[tool.uv]
package = false
